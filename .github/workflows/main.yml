# =====================================================================
#  CLAUFLIX - PROCURAR FILMES NOS SERVIDORES (só pelo ID do IMDb)
#  Você NÃO precisa do link. Basta o ID (tt0479952) e ele testa em
#  TODOS os servidores conhecidos, dizendo em qual o filme existe e
#  devolvendo o link pronto pra tocar.
#
#  COMO USAR:
#   1. No GitHub, crie o arquivo .github/workflows/procurar-filmes.yml
#      com o conteúdo deste arquivo.
#   2. Crie na raiz do repositório o arquivo ids.txt, um ID por linha:
#         tt0479952
#         tt1325004
#      (pode escrever "Madagascar 2 | tt0479952" também, o título é só
#       pra ficar bonito no relatório; pode colar o link do IMDb inteiro,
#       ele acha o tt no meio)
#   3. Aba "Actions" -> "Procurar filmes" -> "Run workflow".
#   4. Baixe o artifact "resultado".
# =====================================================================

name: Procurar filmes

on:
  workflow_dispatch:
    inputs:
      arquivo:
        description: "Arquivo com os IDs (um por linha, ex: tt0479952)"
        required: true
        default: "ids.txt"
      paralelo:
        description: "Quantos filmes testar ao mesmo tempo (1 a 30)"
        required: true
        default: "15"
  push:
    paths:
      - "ids.txt"

permissions:
  contents: read

jobs:
  procurar:
    name: Procurar nos servidores
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Procurar cada ID em todos os servidores
        env:
          ARQUIVO: ${{ github.event.inputs.arquivo || 'ids.txt' }}
          PARALELO: ${{ github.event.inputs.paralelo || '15' }}
        run: |
          set -uo pipefail

          if [ ! -f "$ARQUIVO" ]; then
            echo "::error::Nao achei o arquivo '$ARQUIVO' no repositorio."
            exit 1
          fi
          grep -v -E '^[[:space:]]*(#([[:space:]]|$)|$)' "$ARQUIVO" > lista.txt || true
          echo "IDs para procurar: $(grep -c . lista.txt || true)"

          # ---------------------------------------------------------
          #  SERVIDORES DE FILME (nome amigavel | url base sem o .mp4)
          #  Todos montam o link com o ID do IMDb:
          #     <base><ttID>.mp4
          # ---------------------------------------------------------
          cat > servidores.txt <<'SRV'
          fhd4 | http://fhd4.oneplayer.site/343rt342wtg34wetg34retg4rgh5kh4/FHD4/
          fhd4-b | http://fhd4.oneplayer.site/343rt342wtg34wetg34retg4rghy5rh/FHD4/
          hd5 | http://hd5.oneplayer.site/token/FHD5/
          hd5-b | http://hd5.oneplayer.site/343rt342wtg34wetg34retghksi68ssk/FHD5/
          fhd1 | http://fhd1.oneplayer.site/ertg43r5g34ty34yt543t43wer234t34y3s7/FHD3/
          fhd10 | http://fhd1.oneplayer.site/ertg43r5g34ty34yt543t43wer234t34y3s7/FHD10/
          SRV
          sed -i 's/^[[:space:]]*//; s/[[:space:]]*$//' servidores.txt
          echo "Servidores testados por filme: $(grep -c . servidores.txt)"

          : > bruto.tsv

          procurar() {
            local linha="$1" titulo id achou nome base url code usados
            titulo=""
            if [[ "$linha" == *"|"* ]]; then
              titulo="${linha%%|*}"
              linha="${linha#*|}"
            fi
            titulo="$(printf '%s' "$titulo" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
            id="$(printf '%s' "$linha" | grep -o -E 'tt[0-9]{6,9}' | head -1 || true)"
            [ -z "$id" ] && return 0

            achou=""
            usados=""
            while IFS='|' read -r nome base; do
              nome="$(printf '%s' "${nome:-}" | tr -d '[:space:]')"
              base="$(printf '%s' "${base:-}" | tr -d '[:space:]')"
              [ -z "$nome" ] && continue
              url="${base}${id}.mp4"
              code=$(curl -s -o /dev/null -m 15 --range 0-255 -A "Mozilla/5.0" \
                -H "Referer: https://api-pobreflix-filmes.pages.dev/" -w '%{http_code}' "$url" 2>/dev/null) || true
              [ -z "$code" ] && code="000"
              usados="${usados}${nome}:${code} "
              if [ "$code" = "200" ] || [ "$code" = "206" ]; then
                achou="${achou}${nome}=${url} "
              fi
            done < servidores.txt

            printf '%s\t%s\t%s\t%s\n' "$id" "${titulo:--}" "${achou:-NENHUM}" "${usados% }" >> bruto.tsv
          }
          export -f procurar

          tr '\n' '\0' < lista.txt | xargs -0 -r -P "$PARALELO" -n 1 bash -c 'procurar "$1"' _

          python3 - <<'PY'
          import os, collections
          linhas = []
          for l in open('bruto.tsv', encoding='utf-8', errors='replace'):
              p = l.rstrip('\n').split('\t')
              if len(p) < 4:
                  continue
              achou = [] if p[2] == 'NENHUM' else p[2].split()
              linhas.append({'id': p[0], 'titulo': p[1], 'links': achou, 'bruto': p[3]})
          linhas.sort(key=lambda r: (not r['links'], r['titulo'].lower()))

          com = [r for r in linhas if r['links']]
          sem = [r for r in linhas if not r['links']]
          conta = collections.Counter(nome.split('=')[0] for r in com for nome in r['links'])

          txt = []
          txt.append('=' * 67)
          txt.append('  CLAUFLIX - ONDE ESTAO OS FILMES (busca por ID do IMDb)')
          txt.append('  Procurados: %d   |   Achados: %d   |   Nao achados: %d'
                     % (len(linhas), len(com), len(sem)))
          txt.append('=' * 67)
          txt.append('')
          if conta:
              txt.append('  Em quais servidores apareceram:')
              for k, v in conta.most_common():
                  txt.append('    %-8s %4d filmes' % (k, v))
              txt.append('')
          txt.append('=' * 67)
          txt.append('  ACHADOS (link pronto pra usar no player)')
          txt.append('=' * 67)
          for r in com:
              txt.append('')
              txt.append('- %s  [%s]' % (r['titulo'], r['id']))
              for nome in r['links']:
                  srv, link = nome.split('=', 1)
                  txt.append('    %-8s %s' % (srv, link))
          txt.append('')
          txt.append('=' * 67)
          txt.append('  NAO ACHADOS EM NENHUM SERVIDOR')
          txt.append('=' * 67)
          for r in sem:
              txt.append('  %s  %s   (testado: %s)' % (r['id'], r['titulo'], r['bruto']))
          if not sem:
              txt.append('  (nenhum)')
          txt.append('')
          txt.append('206/200 = o arquivo existe naquele servidor.')
          txt.append('404 = o servidor nao tem esse filme.')
          txt.append('403/530/000 = servidor fora do ar ou bloqueando (nao quer dizer que nao tem).')

          md = ['# Onde estao os filmes', '',
                '**%d procurados - %d achados - %d nao achados**' % (len(linhas), len(com), len(sem)), '',
                '| Filme | ID | Servidor | Link |', '|---|---|---|---|']
          for r in com:
              for nome in r['links']:
                  srv, link = nome.split('=', 1)
                  md.append('| %s | %s | %s | %s |' % (r['titulo'].replace('|', '/'), r['id'], srv, link))
          if sem:
              md.append('')
              md.append('## Nao achados')
              for r in sem:
                  md.append('- %s (%s) - testado: %s' % (r['titulo'], r['id'], r['bruto']))
          md.append('')

          open('resultado.txt', 'w', encoding='utf-8').write('\n'.join(txt) + '\n')
          open('resultado.md', 'w', encoding='utf-8').write('\n'.join(md) + '\n')

          resumo = os.environ.get('GITHUB_STEP_SUMMARY')
          if resumo:
              with open(resumo, 'a', encoding='utf-8') as f:
                  f.write('\n'.join(md) + '\n')
          print('\n'.join(txt))
          PY

      - name: Guardar o resultado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado
          path: |
            resultado.txt
            resultado.md
            bruto.tsv
          if-no-files-found: warn
