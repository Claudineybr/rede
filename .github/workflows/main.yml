# =====================================================================
#  CLAUFLIX - TESTADOR DE FILMES
#  Testa uma lista de links de video e diz quais TOCAM e quais estao
#  mortos, com o codigo exato de cada um.
#
#  COMO USAR (GitHub, uma vez so):
#   1. Crie um repositorio no GitHub (pode ser privado).
#   2. Suba 3 arquivos na raiz: este .yml (dentro de .github/workflows/
#      com o nome testar-filmes.yml), o filmes.txt e nada mais.
#      Caminho final: .github/workflows/testar-filmes.yml
#   3. Aba "Actions" -> "Testar filmes" -> botao "Run workflow".
#   4. Espera terminar e baixa o arquivo "resultado" (fica em Artifacts).
#
#  A lista (filmes.txt) aceita duas formas, uma por linha:
#      Titulo do filme | http://servidor/caminho/FHD5/tt0479952.mp4
#      http://servidor/caminho/FHD5/tt0479952.mp4
#  Linhas em branco e linhas com # na frente sao ignoradas.
# =====================================================================

name: Testar filmes

on:
  workflow_dispatch:
    inputs:
      arquivo:
        description: "Arquivo com a lista (um link por linha, ou Titulo | link)"
        required: true
        default: "filmes.txt"
      paralelo:
        description: "Quantos testes ao mesmo tempo (1 a 30)"
        required: true
        default: "12"
  push:
    paths:
      - "filmes.txt"

permissions:
  contents: read

jobs:
  testar:
    name: Testar links
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Testar os links
        env:
          ARQUIVO: ${{ github.event.inputs.arquivo || 'filmes.txt' }}
          PARALELO: ${{ github.event.inputs.paralelo || '12' }}
          # Seu Worker de videos (o mesmo que o site usa no player)
          WORKER: "https://proxy-videos.claudineibu12.workers.dev/?url="
        run: |
          set -uo pipefail

          if [ ! -f "$ARQUIVO" ]; then
            echo "::error::Nao achei o arquivo '$ARQUIVO' no repositorio."
            exit 1
          fi

          # tira linhas vazias e comentarios
          grep -v -E '^[[:space:]]*(#|$)' "$ARQUIVO" > lista.txt || true
          TOTAL=$(grep -c . lista.txt || true)
          echo "Arquivo: $ARQUIVO  |  links para testar: $TOTAL  |  em paralelo: $PARALELO"
          if [ "$TOTAL" -eq 0 ]; then
            echo "::error::A lista esta vazia."
            exit 1
          fi

          : > resultado.tsv

          testar() {
            local linha="$1" titulo url enc code code1 size via usada
            if [[ "$linha" == *"|"* ]]; then
              titulo="${linha%%|*}"
              url="${linha#*|}"
            else
              titulo=""
              url="$linha"
            fi
            titulo="$(printf '%s' "$titulo" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
            url="$(printf '%s' "$url" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
            [ -z "$url" ] && return 0

            # 1o teste: direto no servidor
            read -r code size < <(curl -sL -o /dev/null -m 30 --range 0-255 \
              -A "Mozilla/5.0" -H "Referer: https://api-pobreflix-filmes.pages.dev/" \
              -w '%{http_code} %{size_download}' "$url" 2>/dev/null) || true
            via="direto"
            usada="$url"
            code1="$code"

            # se o servidor barrou, tenta pelo Worker (como o player faz).
            # So troca a resposta se o Worker conseguir abrir o video; se ele
            # tambem falhar, vale o codigo do servidor (o link esta morto).
            if [ "$code" != "200" ] && [ "$code" != "206" ]; then
              enc=$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1],safe=""))' "$url")
              read -r code size < <(curl -s -o /dev/null -m 30 --range 0-255 \
                -w '%{http_code} %{size_download}' "${WORKER}${enc}" 2>/dev/null) || true
              if [ "$code" = "200" ] || [ "$code" = "206" ]; then
                via="worker"
                usada="${WORKER}${enc}"
              else
                code="$code1"
                size="0"
              fi
            fi

            printf '%s\t%s\t%s\t%s\t%s\t%s\n' "$code" "${size:-0}" "$via" "$titulo" "$url" "$usada" >> resultado.tsv
          }
          export -f testar
          export WORKER

          tr '\n' '\0' < lista.txt | xargs -0 -r -P "$PARALELO" -n 1 bash -c 'testar "$1"' _

          # Monta o relatorio (txt + md) e a tabela que aparece na tela do GitHub
          python3 - <<'PY'
          import os, collections
          linhas = []
          for l in open('resultado.tsv', encoding='utf-8', errors='replace'):
              p = l.rstrip('\n').split('\t')
              if len(p) < 6:
                  continue
              linhas.append(p)

          def veredito(code):
              if code in ('200', '206'):
                  return 'TEM'
              if code in ('404', '410'):
                  return 'NAO TEM'
              if code in ('403', '401', '451'):
                  return 'BLOQUEADO'
              if code in ('000', ''):
                  return 'SEM RESPOSTA'
              return 'ERRO ' + code

          linhas.sort(key=lambda p: (veredito(p[0]) != 'TEM', (p[3] or p[4]).lower()))
          conta = collections.Counter(veredito(p[0]) for p in linhas)

          def tamanho(b):
              try:
                  b = int(b)
              except Exception:
                  return '-'
              for u, n in (('GB', 1024**3), ('MB', 1024**2), ('KB', 1024)):
                  if b >= n:
                      return '%.1f %s' % (b / n, u)
              return '%d B' % b

          txt = []
          md = []
          txt.append('=' * 67)
          txt.append('  CLAUFLIX - RESULTADO DO TESTE DE LINKS')
          txt.append('  Total testado: %d' % len(linhas))
          txt.append('=' * 67)
          txt.append('')
          for k in ('TEM', 'NAO TEM', 'BLOQUEADO', 'SEM RESPOSTA'):
              if conta.get(k):
                  txt.append('  %-13s %5d' % (k, conta[k]))
          for k in sorted(conta):
              if k.startswith('ERRO'):
                  txt.append('  %-13s %5d' % (k, conta[k]))
          txt.append('')
          txt.append('=' * 67)
          txt.append('  DETALHE')
          txt.append('=' * 67)
          for code, size, via, titulo, url, usada in linhas:
              v = veredito(code)
              txt.append('')
              txt.append('[%s] %s' % (v, titulo or '(sem titulo)'))
              txt.append('    link : %s' % url)
              txt.append('    resposta: %s  (%s)  arquivo: %s  via %s' % (code, v, tamanho(size), via))
              if usada != url:
                  txt.append('    funcionou so pelo Worker: %s' % usada)
          txt.append('')
          txt.append('Tudo que respondeu 200/206 tem o video no servidor.')
          txt.append('NAO TEM = o servidor respondeu que o arquivo nao existe (404).')
          txt.append('BLOQUEADO/ERRO = o problema e no servidor de origem, nao no site.')

          md.append('# Resultado do teste de links')
          md.append('')
          md.append('**%d links testados** - ' % len(linhas) + ' - '.join(
              '%s: **%d**' % (k, conta[k]) for k in ('TEM', 'NAO TEM', 'BLOQUEADO', 'SEM RESPOSTA') if conta.get(k)))
          md.append('')
          md.append('| Veredito | Filme | Resposta | Tamanho | Link |')
          md.append('|---|---|---|---|---|')
          for code, size, via, titulo, url, usada in linhas:
              v = veredito(code)
              nome = (titulo or '(sem titulo)').replace('|', '/')
              md.append('| %s | %s | %s | %s | %s |' % (v, nome, code, tamanho(size), url.replace('|', '%7C')))
          md.append('')

          open('resultado.txt', 'w', encoding='utf-8').write('\n'.join(txt) + '\n')
          open('resultado.md', 'w', encoding='utf-8').write('\n'.join(md) + '\n')

          resumo = os.environ.get('GITHUB_STEP_SUMMARY')
          if resumo:
              with open(resumo, 'a', encoding='utf-8') as f:
                  f.write('\n'.join(md) + '\n')

          print('\n'.join(txt))
          PY

      - name: Guardar o resultado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado
          path: |
            resultado.txt
            resultado.md
            resultado.tsv
          if-no-files-found: warn
