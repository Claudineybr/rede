name: Procurar series

on:
  workflow_dispatch:
    inputs:
      arquivo:
        description: "Arquivo com os numeros das series (um por linha, ex: 1418)"
        required: true
        default: "series.txt"
      lote:
        description: "Quantas series processar nesta run (0 = todas de uma vez)"
        required: true
        default: "100"
      paralelo:
        description: "Quantas series testar ao mesmo tempo (1 a 15)"
        required: true
        default: "6"
      max_temporadas:
        description: "Ate qual temporada procurar"
        required: true
        default: "25"
      max_episodios:
        description: "Ate qual episodio procurar em cada temporada"
        required: true
        default: "45"
      retentar:
        description: "RETENTAR os nao achados (ignora series_processadas.txt)"
        type: boolean
        required: false
        default: false
      auto_run:
        description: "Continuar sozinho na proxima run"
        type: boolean
        required: false
        default: true
  push:
    paths:
      - "series.txt"

permissions:
  contents: write
  actions: write

concurrency:
  group: procurar-series
  cancel-in-progress: false

jobs:
  procurar:
    name: Procurar series nos servidores
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_CHAIN || secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------------
      #  1) PREPARAR A FILA
      # -----------------------------------------------------------------
      - name: Preparar lote
        id: preparar
        env:
          ARQUIVO:  ${{ github.event.inputs.arquivo || 'series.txt' }}
          LOTE:     ${{ github.event.inputs.lote || '100' }}
          RETENTAR: ${{ github.event.inputs.retentar || 'false' }}
        run: |
          set -uo pipefail
          ARQ="$ARQUIVO"
          if [ ! -f "$ARQ" ]; then
            echo "::error::Nao achei o arquivo '$ARQ' no repositorio."
            exit 1
          fi

          touch series_processadas.txt series_bruto.tsv

          grep -v -E '^[[:space:]]*(#([[:space:]]|$)|$)' "$ARQ" > lista.txt || true

          # -----------------------------------------------------------------
          #  CONVERSAO DO NOME: "tt0000000<TAB>Nome" (codigo do IMDb)
          #  vira "Nome | numero" (o numero que os servidores usam = TMDB).
          #  Linhas que ja estao em "Nome | numero" ou so com o numero
          #  passam direto, sem mexer.
          # -----------------------------------------------------------------
          UA_TMDB="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"
          : > sem_numero.txt
          if grep -q -E '^[[:space:]]*tt[0-9]+' lista.txt; then
            : > convertidas.txt
            CONV=0
            SEM=0
            while IFS= read -r linha; do
              [ -z "$linha" ] && continue

              if ! printf '%s' "$linha" | grep -q -E '^[[:space:]]*tt[0-9]+'; then
                printf '%s\n' "$linha" >> convertidas.txt
                continue
              fi

              cod=$(printf '%s' "$linha" | grep -o -E '^[[:space:]]*tt[0-9]+' | tr -d '[:space:]')
              nome=$(printf '%s' "$linha" | sed -E 's/^[[:space:]]*tt[0-9]+[[:space:]]*//' | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')
              num=""
              if [ -n "$nome" ]; then
                num=$(curl -s -m 25 -A "$UA_TMDB" -G --data-urlencode "query=$nome" \
                        "https://www.themoviedb.org/search/tv" 2>/dev/null \
                      | grep -o -E '/tv/[0-9]+-' | head -1 | grep -o -E '[0-9]+' || true)
                sleep 1
              fi

              if [ -n "$num" ]; then
                printf '%s | %s\n' "$nome" "$num" >> convertidas.txt
                CONV=$((CONV + 1))
                echo "[convertido] $cod -> $num  $nome"
              else
                printf '%s\t%s\n' "$cod" "$nome" >> sem_numero.txt
                SEM=$((SEM + 1))
                echo "[SEM NUMERO] $cod  $nome  (nao achei no TMDB)"
              fi
            done < lista.txt
            mv convertidas.txt lista.txt
            echo "Convertidas: $CONV   |   sem numero: $SEM"
            if [ "$SEM" -gt 0 ]; then
              echo "::notice::$SEM serie(s) ficaram sem numero (veja sem_numero.txt no artifact)."
            fi
          fi

          TOTAL=$(awk 'END{print NR+0}' lista.txt)

          # Monta a lista de pendentes sem usar "eval" (o awk do GitHub nao tem).
          MODO="PROCURAR"
          if [ "$RETENTAR" = "true" ]; then
            MODO="RETENTAR"
            BASE="series_bruto.tsv"
          else
            BASE="series_processadas.txt"
          fi

          awk -v base="$BASE" '
            FILENAME == base { p[$1]=1; next }
            {
              linha = $0
              if (index(linha, "|") > 0) sub(/^[^|]*[|][[:space:]]*/, "", linha)
              if (match(linha, /[0-9]+/)) id = substr(linha, RSTART, RLENGTH); else id = ""
              if (id != "" && !(id in p)) print $0
            }
          ' "$BASE" lista.txt > pendentes.txt

          PEND=$(awk 'END{print NR+0}' pendentes.txt)
          JA=$((TOTAL - PEND))

          if [ "$TOTAL" -gt 0 ]; then
            PCT=$(awk -v p="$JA" -v t="$TOTAL" 'BEGIN{ printf "%.1f", p*100/t }')
          else
            PCT="0.0"
          fi

          if [ "$LOTE" = "0" ] || [ "$LOTE" = "" ] || [ "$PEND" -lt "$LOTE" ]; then
            LOTE_EF=$PEND
          else
            LOTE_EF=$LOTE
          fi
          DEPOIS=$(( PEND - LOTE_EF ))

          {
            echo "###################################################################"
            echo "#  FILA DE PROCESSAMENTO (SERIES)   [MODO: $MODO]"
            echo "#  -----------------------------------------------------------------"
            echo "#  Total de series no arquivo:    $TOTAL"
            if [ "$MODO" = "RETENTAR" ]; then
              echo "#  Ja encontradas antes:          $JA"
              echo "#  FALTAM RETENTAR (nao achadas): $PEND"
            else
              echo "#  Ja processadas antes:          $JA  (${PCT}%)"
              echo "#  FALTAM PROCESSAR agora:        $PEND"
            fi
            echo "#  Este lote vai processar:       $LOTE_EF"
            echo "#  Vai faltar depois deste:       $DEPOIS"
            echo "###################################################################"
          } | tee -a "$GITHUB_STEP_SUMMARY"

          if [ "$MODO" = "RETENTAR" ]; then
            echo "::notice::[SERIES][RETENTAR] Faltam $PEND nao-achadas de $TOTAL. Este lote: $LOTE_EF. Apos este: $DEPOIS."
          else
            echo "::notice::[SERIES][PROCURAR] Faltam $PEND series de $TOTAL (${PCT}% concluido). Este lote: $LOTE_EF. Apos este: $DEPOIS."
          fi

          if [ "$PEND" -eq 0 ]; then
            echo "::notice::Fila vazia - todas as $TOTAL series ja foram processadas."
            echo "VAZIO=1"        >> "$GITHUB_OUTPUT"
            echo "FALTAM=0"       >> "$GITHUB_OUTPUT"
            echo "MODO=$MODO"     >> "$GITHUB_OUTPUT"
            echo "0" > /tmp/faltam.txt
            : > lote_atual.txt
            exit 0
          fi

          head -n "$LOTE_EF" pendentes.txt > lote_atual.txt
          N=$(awk 'END{print NR+0}' lote_atual.txt)
          FALTAM=$((PEND - N))
          echo "$FALTAM" > /tmp/faltam.txt
          echo "VAZIO=0"        >> "$GITHUB_OUTPUT"
          echo "FALTAM=$FALTAM" >> "$GITHUB_OUTPUT"
          echo "MODO=$MODO"     >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------
      #  2) BUSCAR CADA SERIE (log em tempo real)
      # -----------------------------------------------------------------
      - name: Procurar cada serie em todos os servidores
        if: steps.preparar.outputs.VAZIO == '0'
        env:
          PARALELO: ${{ github.event.inputs.paralelo || '6' }}
          MAXT:     ${{ github.event.inputs.max_temporadas || '25' }}
          MAXE:     ${{ github.event.inputs.max_episodios || '45' }}
          MODO:     ${{ steps.preparar.outputs.MODO }}
        run: |
          set -uo pipefail

          cat > servidores.txt <<'SRV'
          shd0 | http://shd0.oneplayer.site/rfg54ry435y45y45y45y45y45rt23w4r324wt34tr34t3e4wtf582/SHD0/
          shd1 | http://shd1.oneplayer.site/y45y456y45y54eytg345t4rfwserdfwe4rtrf34t65435redso/SHD1/
          shd2 | http://shd2.oneplayer.site/5yu456y45tge4rtfg4w3ertf34t43retg54y65uj65npw/SHD2/
          shd11 | http://shd11.oneplayer.site/token/SHD11/
          shd12 | http://shd12.oneplayer.site/token/SHD12/
          SRV
          sed -i 's/^[[:space:]]*//; s/[[:space:]]*$//' servidores.txt
          echo "Servidores testados por serie: $(awk 'END{print NR+0}' servidores.txt)"

          : > bruto_lote.tsv
          : > nao_encontrados_lote.tsv
          : > processadas_lote.txt

          TOTAL_LOTE=$(awk 'END{print NR+0}' lote_atual.txt)
          export TOTAL_LOTE MODO MAXT MAXE

          : > /tmp/contador.n
          : > /tmp/contador.lock

          {
            echo "==================================================================="
            echo " INICIANDO BUSCA [SERIES][$MODO] - LOTE DE $TOTAL_LOTE - PARALELO=$PARALELO"
            echo " Progresso em tempo real: [n/total] OK=achou XX=nao"
            echo "==================================================================="
          } >&2

          pede() {
            local code
            code=$(curl -s -o /dev/null -m 12 --range 0-255 -A "Mozilla/5.0" \
              -H "Referer: https://api-pobreflix-filmes.pages.dev/" -w '%{http_code}' "$1" 2>/dev/null) || true
            [ -z "$code" ] && code="000"
            printf '%s' "$code"
          }
          existe() { [ "$1" = "200" ] || [ "$1" = "206" ]; }

          procurar() {
            local linha="$1" titulo id nome base url code s e falhas_s falhas_e achou_algum n
            titulo=""
            if [[ "$linha" == *"|"* ]]; then
              titulo="${linha%%|*}"; linha="${linha#*|}"
            fi
            titulo="$(printf '%s' "$titulo" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
            id="$(printf '%s' "$linha" | grep -o -E '[0-9]{1,9}' | head -1 || true)"
            [ -z "$id" ] && return 0

            achou_algum=""
            while IFS='|' read -r nome base; do
              nome="$(printf '%s' "${nome:-}" | tr -d '[:space:]')"
              base="$(printf '%s' "${base:-}" | tr -d '[:space:]')"
              [ -z "$nome" ] && continue

              code=$(pede "${base}${id}/1x1.mp4")
              existe "$code" || continue
              achou_algum="sim"

              falhas_s=0; s=1
              while [ "$s" -le "$MAXT" ]; do
                code=$(pede "${base}${id}/${s}x1.mp4")
                if ! existe "$code"; then
                  falhas_s=$((falhas_s + 1))
                  [ "$falhas_s" -ge 2 ] && break
                  s=$((s + 1)); continue
                fi
                falhas_s=0

                e=1; falhas_e=0
                while [ "$e" -le "$MAXE" ]; do
                  url="${base}${id}/${s}x${e}.mp4"
                  code=$(pede "$url")
                  if existe "$code"; then
                    falhas_e=0
                    printf '%s\t%s\t%s\t%s\t%s\t%s\n' "$id" "${titulo:--}" "$nome" "$s" "$e" "$url" >> bruto_lote.tsv
                  else
                    falhas_e=$((falhas_e + 1))
                    [ "$falhas_e" -ge 2 ] && break
                  fi
                  e=$((e + 1))
                done
                s=$((s + 1))
              done
            done < servidores.txt

            printf '%s\n' "$id" >> processadas_lote.txt
            [ -z "$achou_algum" ] && printf '%s\t%s\n' "$id" "${titulo:--}" >> nao_encontrados_lote.tsv

            n=$(flock /tmp/contador.lock bash -c \
                 'n=$(( $(cat /tmp/contador.n 2>/dev/null || echo 0) + 1 )); echo "$n" > /tmp/contador.n; echo "$n"')

            if [ -n "$achou_algum" ]; then
              printf '[%s/%s] OK %s  %s\n' "$n" "$TOTAL_LOTE" "$id" "${titulo:--}" >&2
            else
              printf '[%s/%s] XX %s  %s  (nenhum servidor)\n' "$n" "$TOTAL_LOTE" "$id" "${titulo:--}" >&2
            fi
          }
          export -f procurar pede existe

          tr '\n' '\0' < lote_atual.txt \
            | stdbuf -oL -eL xargs -0 -r -P "$PARALELO" -n 1 \
                stdbuf -oL -eL bash -c 'procurar "$1"' _

          ACHOU_LOTE=$(awk 'END{print NR+0}' bruto_lote.tsv)
          NAO_LOTE=$(awk 'END{print NR+0}' nao_encontrados_lote.tsv)
          {
            echo "==================================================================="
            echo " LOTE CONCLUIDO [$MODO] - $TOTAL_LOTE processadas"
            echo "   series achadas:      $((TOTAL_LOTE - NAO_LOTE))"
            echo "   series nao achadas:  $NAO_LOTE"
            echo "   episodios achados:   $ACHOU_LOTE"
            echo "==================================================================="
          } >&2

          awk -F'\t' '{ key=$1"|"$3"|"$4"|"$5; if (!(key in seen)) { seen[key]=1; print } }' \
            series_bruto.tsv bruto_lote.tsv > merged.tmp && mv merged.tmp series_bruto.tsv

          cat processadas_lote.txt >> series_processadas.txt
          awk '!seen[$0]++' series_processadas.txt > p.tmp && mv p.tmp series_processadas.txt

      # -----------------------------------------------------------------
      #  3) RELATORIOS + UM TXT POR SERIE  ->  pasta series/
      # -----------------------------------------------------------------
      - name: Montar relatorios e TXTs por serie (pasta series/)
        if: steps.preparar.outputs.VAZIO == '0'
        run: |
          python3 -u - <<'PY'
          import os, re

          def ler_titulos(caminho):
              titulos, ordem_input = {}, []
              try:
                  for l in open(caminho, encoding='utf-8', errors='replace'):
                      l = l.rstrip('\n')
                      if not l.strip() or l.lstrip().startswith('#'):
                          continue
                      if '|' in l:
                          titulo, num = l.split('|', 1)
                          m = re.search(r'\d+', num)
                          if m:
                              sid = m.group()
                              titulos[sid] = titulo.strip()
                              ordem_input.append(sid)
                      else:
                          m = re.search(r'\d+', l)
                          if m:
                              sid = m.group()
                              titulos.setdefault(sid, '-')
                              ordem_input.append(sid)
              except FileNotFoundError:
                  pass
              return titulos, ordem_input

          def ler_encontradas(caminho):
              series, titulos_bruto = {}, {}
              try:
                  for l in open(caminho, encoding='utf-8', errors='replace'):
                      p = l.rstrip('\n').split('\t')
                      if len(p) < 6: continue
                      try:
                          sid, titulo, srv, s, e, url = p[0], p[1], p[2], int(p[3]), int(p[4]), p[5]
                      except ValueError:
                          continue
                      series.setdefault(sid, {}).setdefault(srv, {}).setdefault(s, {})[e] = url
                      if titulo not in ('-', ''):
                          titulos_bruto.setdefault(sid, titulo)
              except FileNotFoundError:
                  pass
              return series, titulos_bruto

          def ler_processadas(caminho):
              try:
                  return set(l.strip() for l in open(caminho) if l.strip())
              except FileNotFoundError:
                  return set()

          def faixa(nums):
              nums = sorted(nums)
              if not nums: return ''
              partes, ini, ant = [], nums[0], nums[0]
              for n in nums[1:]:
                  if n == ant + 1: ant = n; continue
                  partes.append(str(ini) if ini == ant else f'{ini}-{ant}')
                  ini = ant = n
              partes.append(str(ini) if ini == ant else f'{ini}-{ant}')
              return ', '.join(partes)

          titulos, ordem_input = ler_titulos('series.txt')
          series, titulos_bruto = ler_encontradas('series_bruto.tsv')
          processadas = ler_processadas('series_processadas.txt')

          def titulo_de(sid):
              t = titulos.get(sid, '-')
              return t if t not in ('-', '') else titulos_bruto.get(sid, '-')

          achadas = set(series.keys())
          nao_achadas = processadas - achadas
          todas = achadas | processadas | set(titulos.keys())

          ordem, vistas = [], set()
          for sid in ordem_input:
              if sid not in vistas:
                  vistas.add(sid); ordem.append(sid)
          for sid in sorted(todas - vistas, key=lambda x: (titulo_de(x).lower(), x)):
              ordem.append(sid)

          total_eps = sum(len(eps) for sid in series for srv in series[sid] for eps in series[sid][srv].values())

          # ---------- pasta series/ (vai pro repo) ----------
          os.makedirs('series', exist_ok=True)
          # so ficam os txt das series que foram achadas
          for arq in os.listdir('series'):
              if arq == 'indice.txt': continue
              if arq.endswith('.txt') and arq[:-4] not in achadas:
                  try: os.remove(os.path.join('series', arq))
                  except OSError: pass

          indice = ['LISTA DAS SERIES PROCURADAS', '=' * 40, '']
          for sid in ordem:
              t = titulo_de(sid)
              tem = sid in achadas
              linhas = []
              if t not in ('-', ''):
                  linhas.append(f'SERIE: {t}')
              linhas.append(f'NUMERO DA SERIE: {sid}')
              linhas.append('=' * 67)
              if not tem:
                  linhas.append('')
                  linhas.append('NAO ACHEI essa serie em nenhum dos servidores testados.')
                  indice.append(f'{sid}{"  " + t if t not in ("-", "") else ""}  ->  NAO ACHEI')
              else:
                  eps_serie = 0
                  blocos = []
                  for srv_nome in sorted(series[sid]):
                      blocos.append('')
                      blocos.append(f'SERVIDOR: {srv_nome}')
                      for s in sorted(series[sid][srv_nome]):
                          eps = series[sid][srv_nome][s]
                          eps_serie += len(eps)
                          blocos.append(f'  Temporada {s} ({len(eps)} episodios): {faixa(eps.keys())}')
                          for e in sorted(eps):
                              blocos.append(f'    {eps[e]}')
                  linhas.append(f'Episodios encontrados: {eps_serie}')
                  linhas.extend(blocos)
                  indice.append(f'{sid}{"  " + t if t not in ("-", "") else ""}  ->  {eps_serie} episodios')
              # serie NAO achada: nao salva o txt (so aparece no indice)
              if not tem:
                  continue
              linhas.append('')
              linhas.append('206/200 = o arquivo do episodio existe. 404 = nao existe.')
              with open(f'series/{sid}.txt', 'w', encoding='utf-8') as f:
                  f.write('\n'.join(linhas) + '\n')
              print(f'   txt pronto: series/{sid}.txt', flush=True)

          with open('series/indice.txt', 'w', encoding='utf-8') as f:
              f.write('\n'.join(indice) + '\n')

          # ---------- relatorio geral (artifact) ----------
          txt = []
          txt.append('=' * 67)
          txt.append('  CLAUFLIX - ONDE ESTAO AS SERIES')
          txt.append(f'  Procuradas: {len(todas)}   |   Achadas: {len(achadas)}   |   Nao achadas: {len(nao_achadas)}')
          txt.append(f'  Episodios encontrados no total: {total_eps}')
          txt.append('=' * 67)
          txt.append('')
          txt.append('=' * 67)
          txt.append('  ACHADAS')
          txt.append('=' * 67)
          links = []
          for sid in sorted(achadas, key=lambda x: titulo_de(x).lower()):
              t = titulo_de(sid)
              txt.append('')
              txt.append(f'- {sid}' if t in ('-', '') else f'- {t}  [{sid}]')
              for srv_nome in sorted(series[sid]):
                  temporadas = ', '.join(f'T{s} ({len(series[sid][srv_nome][s])} eps)'
                                          for s in sorted(series[sid][srv_nome]))
                  txt.append(f'    {srv_nome:<6} {temporadas}')
                  for s in sorted(series[sid][srv_nome]):
                      eps = series[sid][srv_nome][s]
                      txt.append(f'           T{s} -> episodios {faixa(eps.keys())}')
                      for e in sorted(eps):
                          links.append(eps[e])
              txt.append(f'           arquivo: series/{sid}.txt')

          txt.append('')
          txt.append('=' * 67)
          txt.append('  NAO ACHADAS')
          txt.append('=' * 67)
          if nao_achadas:
              for sid in sorted(nao_achadas, key=lambda x: titulo_de(x).lower()):
                  t = titulo_de(sid)
                  txt.append(f'  {sid}' if t in ('-', '') else f'  {sid}  {t}')
          else:
              txt.append('  (nenhuma)')
          txt.append('')

          md = ['# Onde estao as series', '',
                f'**{len(todas)} procuradas - {len(achadas)} achadas - {len(nao_achadas)} nao achadas - {total_eps} episodios**', '',
                '| Serie | ID | Servidor | Temporadas | Episodios | Link do 1o |', '|---|---|---|---|---|---|']
          for sid in sorted(achadas, key=lambda x: titulo_de(x).lower()):
              t = titulo_de(sid)
              nome = sid if t in ('-', '') else t.replace('|', '/')
              for srv_nome in sorted(series[sid]):
                  temporadas = '<br>'.join(f'T{s}' for s in sorted(series[sid][srv_nome]))
                  episodios = '<br>'.join(faixa(series[sid][srv_nome][s].keys())
                                           for s in sorted(series[sid][srv_nome]))
                  s0 = sorted(series[sid][srv_nome])[0]
                  e0 = sorted(series[sid][srv_nome][s0])[0]
                  md.append(f'| {nome} | {sid} | {srv_nome} | {temporadas} | {episodios} | {series[sid][srv_nome][s0][e0]} |')
          if nao_achadas:
              md += ['', '## Nao achadas']
              for sid in sorted(nao_achadas, key=lambda x: titulo_de(x).lower()):
                  t = titulo_de(sid)
                  md.append(f'- {sid}' if t in ('-', '') else f'- {t} ({sid})')
          md.append('')

          open('resultado-series.txt', 'w', encoding='utf-8').write('\n'.join(txt) + '\n')
          open('resultado-series.md', 'w', encoding='utf-8').write('\n'.join(md) + '\n')
          open('links-series.txt', 'w', encoding='utf-8').write('\n'.join(links) + ('\n' if links else ''))

          resumo = os.environ.get('GITHUB_STEP_SUMMARY')
          if resumo:
              with open(resumo, 'a', encoding='utf-8') as f:
                  f.write('\n'.join(md) + '\n')
          print('')
          print('\n'.join(txt))
          PY

      # -----------------------------------------------------------------
      #  4) COMMIT (estado da fila + estado dos achados + pasta series/)
      # -----------------------------------------------------------------
      - name: Commit do progresso
        if: steps.preparar.outputs.VAZIO == '0'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # estado da fila
          git add series_processadas.txt series_bruto.tsv
          # pasta com um txt por serie (vai pro repo!)
          if [ -d series ]; then
            git add -A series/
          fi

          if git diff --staged --quiet; then
            echo "Sem mudancas para commitar."
            exit 0
          fi

          ARQS=$(git diff --staged --name-only | wc -l)
          echo "Arquivos alterados: $ARQS"

          git commit -m "chore: series ${{ steps.preparar.outputs.MODO }} lote $(date -u +%Y%m%dT%H%MZ) - $ARQS arquivo(s) [skip ci]"

          for i in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase origin "${{ github.ref_name }}" || true
            sleep 5
          done
          echo "::error::Falha ao dar push apos 3 tentativas."
          exit 1

      # -----------------------------------------------------------------
      #  5) ARTIFACT (mesma pasta series/ + relatorios)
      # -----------------------------------------------------------------
      - name: Guardar o resultado (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-series-${{ github.run_number }}
          path: |
            resultado-series.txt
            resultado-series.md
            links-series.txt
            series/
            bruto_lote.tsv
            nao_encontrados_lote.tsv
            series_processadas.txt
            series_bruto.tsv
            sem_numero.txt
          if-no-files-found: warn

      # -----------------------------------------------------------------
      #  6) DISPARAR PROXIMA RUN
      # -----------------------------------------------------------------
      - name: Disparar proxima run
        if: |
          success() &&
          steps.preparar.outputs.VAZIO == '0' &&
          steps.preparar.outputs.FALTAM != '0' &&
          (
            github.event_name == 'push' ||
            inputs.auto_run == true ||
            github.event.inputs.auto_run == 'true'
          )
        env:
          GH_TOKEN: ${{ secrets.PAT_CHAIN }}
          REPO: ${{ github.repository }}
          ARQ_IN:  ${{ github.event.inputs.arquivo || 'series.txt' }}
          LOTE_IN: ${{ github.event.inputs.lote || '100' }}
          PAR_IN:  ${{ github.event.inputs.paralelo || '6' }}
          MAXT_IN: ${{ github.event.inputs.max_temporadas || '25' }}
          MAXE_IN: ${{ github.event.inputs.max_episodios || '45' }}
          RET_IN:  ${{ github.event.inputs.retentar || 'false' }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Sem o segredo PAT_CHAIN: nao consigo me chamar de novo."
            exit 0
          fi

          FALTAM=$(cat /tmp/faltam.txt 2>/dev/null || echo 0)
          echo "Faltam: $FALTAM (retentar=$RET_IN)"
          if [ "${FALTAM:-0}" -le 0 ]; then
            echo "Fila vazia, encerrando."
            exit 0
          fi

          LIMITE_ISO=$(date -u -d '60 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          RECENTES=$(gh run list --workflow="procurar-series.yml" \
            --event workflow_dispatch --limit 100 \
            --json createdAt \
            --jq "[.[] | select(.createdAt > \"$LIMITE_ISO\")] | length" \
            --repo "$REPO" 2>/dev/null || echo 0)
          echo "Encadeamentos na ultima hora: $RECENTES"
          if [ "${RECENTES:-0}" -ge 20 ]; then
            echo "Muitas runs na ultima hora, esperando a proxima janela."
            exit 0
          fi

          sleep 30
          gh workflow run "procurar-series.yml" --repo "$REPO" --ref "${{ github.ref_name }}" \
            -f auto_run=true -f arquivo="$ARQ_IN" -f lote="$LOTE_IN" \
            -f paralelo="$PAR_IN" -f max_temporadas="$MAXT_IN" -f max_episodios="$MAXE_IN" \
            -f retentar="$RET_IN"
          echo "Proxima run disparada."
