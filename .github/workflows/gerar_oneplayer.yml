name: Gerar HTML Oneplayer

on:
  workflow_dispatch:
    inputs:
      arquivo_lista:
        description: "Arquivo com a lista (tt - links)"
        default: "filmes_oneplayer.txt"
      pasta_saida:
        description: "Pasta onde os .html serão salvos"
        default: "oneplayer"
      refazer:
        description: "Refazer HTMLs que já existem?"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Arquivo de entrada esperado: 'filmes_oneplayer.txt' com formato:
      #   tt7896543 - https://exemplo.com/link.mp4  (um por linha)
      # Se o arquivo não existir ou estiver vazio, nenhum HTML será gerado.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar HTMLs
        # ⚠️ O workflow requer o secret TMDB_API_KEY no repositório.
        #    Sem a key, nenhum HTML será gerado (os filmes serão listados em _nao_encontrados.txt).
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          ARQUIVO: ${{ inputs.arquivo_lista }}
          PASTA: ${{ inputs.pasta_saida }}
          REFAZER: ${{ inputs.refazer }}
        run: |
          python3 - <<'PY'
          import os, re, json, time, html, urllib.request, urllib.parse

          KEY     = os.environ["TMDB_API_KEY"]
          ARQUIVO = os.environ.get("ARQUIVO") or "filmes_oneplayer.txt"
          PASTA   = os.environ.get("PASTA") or "oneplayer"
          REFAZER = os.environ.get("REFAZER") == "true"
          SUFIXO  = "🍿Clau"

          os.makedirs(PASTA, exist_ok=True)

          MODELO = '''<!DOCTYPE html>
          <html lang="pt-BR">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <link rel="icon" type="image/svg+xml" href="/icones/favicon.svg?v=2">
          <link rel="icon" type="image/png" sizes="32x32" href="/icones/favicon-32.png?v=2">
          <link rel="apple-touch-icon" href="/icones/apple-touch-icon.png?v=2">
          <script type="application/ld+json">{
            "@context": "https://schema.org",
            "@type": "VideoObject",
            "supportPlatform": [
              "https://schema.org/IOSPlatform",
              "https://schema.org/AndroidPlatform"
            ],
            "name": @@TITULO_JSON@@,
            "description": @@DESC_JSON@@,
            "thumbnailUrl": [
              @@CAPA_JSON@@
            ],
            "contentUrl": @@LINK_JSON@@
          }</script>
          <title>@@TITULO@@</title>
          <style>
            body { background: #000; color: #fff; font-family: sans-serif; margin: 0; padding: 20px; }
            h1 { font-size: 24px; text-align: center; margin-bottom: 30px; }
          </style>
          </head>
          <body>

          <a href="/" style="display:inline-block; margin:0 0 18px; padding:10px 18px; border-radius:999px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.2); color:#fff; font-size:14px; font-weight:600; text-decoration:none;">← Voltar ao início</a>

          <h1>@@TITULO@@</h1>

          <div style="background: #0b0b12; border-radius:20px; overflow:hidden; box-shadow:0 25px 60px rgba(0,0,0,.8); margin:25px 0; border:1px solid rgba(255,255,255,.06);">

            <a href="@@LINK@@" target="_blank" style="display: block; position: relative; text-decoration: none;">

              <img src="@@CAPA@@" style="width:100%; display:block;">

              <div style="position:absolute; inset:0; background:linear-gradient(to top, rgba(0,0,0,0.7), transparent);"></div>

              <div style="position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); width:70px; height:70px; background:linear-gradient(135deg,#7a00ff,#c000ff); border-radius:50%; display:flex; align-items:center; justify-content:center; box-shadow:0 0 20px rgba(120,0,255,.6); color:white; font-size:26px; border:2px solid rgba(255,255,255,.2);">▶</div>

              <div style="position:absolute; top:12px; right:12px; background:#ff003c; padding:6px 12px; border-radius:20px; font-size:11px; color:#fff; font-weight:bold;">HD</div>
            </a>

          </div>

          </body>
          </html>
          '''
          # remove a indentação do bloco YAML
          MODELO = "\n".join(l[10:] if l.startswith(" " * 10) else l for l in MODELO.split("\n"))

          def tmdb(imdb_id):
              url = ("https://api.themoviedb.org/3/find/" + imdb_id + "?" +
                     urllib.parse.urlencode({"api_key": KEY,
                                             "external_source": "imdb_id",
                                             "language": "pt-BR"}))
              for t in range(3):
                  try:
                      with urllib.request.urlopen(url, timeout=20) as r:
                          return json.load(r)
                  except Exception as e:
                      print(f"  tentativa {t+1} falhou: {e}")
                      time.sleep(2)
              return None

          def primeiro_link(resto):
              m = re.search(r'\b[a-z]+\d*=(https?://\S+)', resto)
              return m.group(1) if m else None

          ok = pulados = 0
          nao_achou = []

          with open(ARQUIVO, encoding="utf-8") as f:
              linhas = [l.strip() for l in f if l.strip()]

          for linha in linhas:
              m = re.match(r'^(tt\d+)\s*-?\s*(.*)$', linha)
              if not m:
                  continue
              tt, resto = m.groups()
              destino = os.path.join(PASTA, tt + ".html")

              if os.path.exists(destino) and not REFAZER:
                  pulados += 1
                  continue

              link = primeiro_link(resto)
              if not link:
                  print(f"{tt}: sem link, pulando")
                  nao_achou.append(tt + " (sem link)")
                  continue

              dados = tmdb(tt)
              res = (dados or {}).get("movie_results") or (dados or {}).get("tv_results") or []
              if not res:
                  print(f"{tt}: não encontrado no TMDB")
                  nao_achou.append(tt)
                  continue

              r = res[0]
              nome = r.get("title") or r.get("name") or r.get("original_title") or tt
              data = r.get("release_date") or r.get("first_air_date") or ""
              ano = data[:4]
              titulo = f"{nome} ({ano}) - {SUFIXO}" if ano else f"{nome} - {SUFIXO}"
              capa = ("https://image.tmdb.org/t/p/w500" + r["poster_path"]) if r.get("poster_path") else ""

              saida = (MODELO
                  .replace("@@TITULO_JSON@@", json.dumps(titulo, ensure_ascii=False))
                  .replace("@@DESC_JSON@@", json.dumps("Assista " + titulo, ensure_ascii=False))
                  .replace("@@CAPA_JSON@@", json.dumps(capa))
                  .replace("@@LINK_JSON@@", json.dumps(link))
                  .replace("@@TITULO@@", html.escape(titulo))
                  .replace("@@LINK@@", html.escape(link, quote=True))
                  .replace("@@CAPA@@", html.escape(capa, quote=True)))

              with open(destino, "w", encoding="utf-8") as out:
                  out.write(saida)
              print(f"{tt}: {titulo}")
              ok += 1
              time.sleep(0.15)

          if nao_achou:
              with open(os.path.join(PASTA, "_nao_encontrados.txt"), "w") as f:
                  f.write("\n".join(nao_achou) + "\n")

          print(f"\nGerados: {ok} | Já existiam: {pulados} | Falhas: {len(nao_achou)}")
          PY

      - name: Commit e push
        env:
          PASTA: ${{ inputs.pasta_saida }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${PASTA:-oneplayer}"
          if git diff --cached --quiet; then
            echo "Nada novo para commitar."
          else
            git commit -m "Gerar HTMLs oneplayer"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push
          fi
