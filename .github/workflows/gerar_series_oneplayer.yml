name: Gerar HTML Series Oneplayer

on:
  workflow_dispatch:
    inputs:
      pasta_series:
        description: "Pasta com os .txt das séries"
        default: "series"
      arquivo_unico:
        description: "Só uma série? (ex: 100010.txt). Vazio = todas"
        default: ""
      pasta_saida:
        description: "Pasta onde os .html serão salvos"
        default: "series_html"
      refazer:
        description: "Refazer HTMLs que já existem?"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar HTMLs
        env:
          PYTHONUNBUFFERED: "1"
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          PASTA_SERIES: ${{ inputs.pasta_series }}
          UNICO: ${{ inputs.arquivo_unico }}
          PASTA: ${{ inputs.pasta_saida }}
          REFAZER: ${{ inputs.refazer }}
        run: |
          python3 -u - <<'PY'
          import os, re, json, time, glob, html, urllib.request, urllib.parse, urllib.error

          KEY          = os.environ["TMDB_API_KEY"]
          PASTA_SERIES = os.environ.get("PASTA_SERIES") or "series"
          UNICO        = (os.environ.get("UNICO") or "").strip()
          PASTA        = os.environ.get("PASTA") or "series_html"
          REFAZER      = os.environ.get("REFAZER") == "true"
          SUFIXO       = "🍿Clau"
          IMG          = "https://image.tmdb.org/t/p/w500"
          OVERRIDES    = "series_tmdb.txt"

          MODELO = '''<!DOCTYPE html>
          <html lang="pt-BR">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <link rel="icon" type="image/svg+xml" href="/icones/favicon.svg?v=2">
          <link rel="icon" type="image/png" sizes="32x32" href="/icones/favicon-32.png?v=2">
          <link rel="apple-touch-icon" href="/icones/apple-touch-icon.png?v=2">
          <script type="application/ld+json">{
            "@context": "https://schema.org",
            "@type": "VideoObject",
            "supportPlatform": [
              "https://schema.org/IOSPlatform",
              "https://schema.org/AndroidPlatform"
            ],
            "name": @@TITULO_JSON@@,
            "description": @@DESC_JSON@@,
            "thumbnailUrl": [
              @@CAPA_JSON@@
            ],
            "contentUrl": @@LINK_JSON@@
          }</script>
          <title>@@TITULO@@</title>
          <style>
            body { background: #000; color: #fff; font-family: sans-serif; margin: 0; padding: 20px; }
            h1 { font-size: 24px; text-align: center; margin-bottom: 30px; }
          </style>
          </head>
          <body>

          <a href="/" style="display:inline-block; margin:0 0 18px; padding:10px 18px; border-radius:999px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.2); color:#fff; font-size:14px; font-weight:600; text-decoration:none;">← Voltar ao início</a>

          <h1>@@TITULO@@</h1>

          <div style="background: #0b0b12; border-radius:20px; overflow:hidden; box-shadow:0 25px 60px rgba(0,0,0,.8); margin:25px 0; border:1px solid rgba(255,255,255,.06);">

            <a href="@@LINK@@" target="_blank" style="display: block; position: relative; text-decoration: none;">

              <img src="@@CAPA@@" style="width:100%; display:block;">

              <div style="position:absolute; inset:0; background:linear-gradient(to top, rgba(0,0,0,0.7), transparent);"></div>

              <div style="position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); width:70px; height:70px; background:linear-gradient(135deg,#7a00ff,#c000ff); border-radius:50%; display:flex; align-items:center; justify-content:center; box-shadow:0 0 20px rgba(120,0,255,.6); color:white; font-size:26px; border:2px solid rgba(255,255,255,.2);">▶</div>

              <div style="position:absolute; top:12px; right:12px; background:#ff003c; padding:6px 12px; border-radius:20px; font-size:11px; color:#fff; font-weight:bold;">HD</div>
            </a>

          </div>

          </body>
          </html>
          '''

          def api(caminho, **params):
              params.update({"api_key": KEY, "language": "pt-BR"})
              url = "https://api.themoviedb.org/3" + caminho + "?" + urllib.parse.urlencode(params)
              for t in range(3):
                  try:
                      with urllib.request.urlopen(url, timeout=20) as r:
                          return json.load(r)
                  except urllib.error.HTTPError as e:
                      if e.code == 404:
                          return None
                      print(f"  ! tentativa {t+1} falhou: {e}")
                  except Exception as e:
                      print(f"  ! tentativa {t+1} falhou: {e}")
                  time.sleep(2)
              return None

          def norm(s):
              return re.sub(r'[^a-z0-9]', '', (s or "").lower())

          def parse_txt(texto):
              m = re.search(r'^\s*SERIE:\s*(.+?)\s*$', texto, re.M)
              nome = m.group(1) if m else ""
              m = re.search(r'NUMERO DA SERIE:\s*(\d+)', texto)
              numero = m.group(1) if m else ""
              eps = {}
              for url in re.findall(r'https?://\S+', texto):
                  mm = re.search(r'/(\d+)x(\d+)\.\w+$', url)
                  if mm:
                      eps.setdefault((int(mm.group(1)), int(mm.group(2))), url)
              return nome, numero, eps

          def carregar_overrides():
              d = {}
              if os.path.exists(OVERRIDES):
                  for l in open(OVERRIDES, encoding="utf-8"):
                      m = re.match(r'^\s*(\d+)\s*=\s*(\d+)', l)
                      if m:
                          d[m.group(1)] = int(m.group(2))
              return d

          def achar_serie(nome, max_temp, tmdb_id=None):
              if tmdb_id:
                  return api(f"/tv/{tmdb_id}")
              d = api("/search/tv", query=nome)
              res = (d or {}).get("results") or []
              if not res:
                  return None
              alvo = norm(nome)
              exatos = [r for r in res if norm(r.get("name")) == alvo or norm(r.get("original_name")) == alvo]
              ordem = exatos + [r for r in res if r not in exatos]
              for r in ordem[:5]:
                  det = api(f"/tv/{r['id']}")
                  time.sleep(0.1)
                  if det and (det.get("number_of_seasons") or 0) >= max_temp:
                      return det
              return api(f"/tv/{ordem[0]['id']}")

          cache_temp = {}
          def dados_temporada(tv_id, s):
              k = (tv_id, s)
              if k not in cache_temp:
                  d = api(f"/tv/{tv_id}/season/{s}")
                  cache_temp[k] = {x["episode_number"]: x for x in (d or {}).get("episodes", [])}
                  time.sleep(0.15)
              return cache_temp[k]

          overrides = carregar_overrides()
          os.makedirs(PASTA, exist_ok=True)

          if UNICO:
              arquivos = [os.path.join(PASTA_SERIES, UNICO)]
          else:
              arquivos = sorted(f for f in glob.glob(os.path.join(PASTA_SERIES, "*.txt"))
                                if not os.path.basename(f).startswith("_"))

          total = pulados = 0
          problemas = []
          relatorio = []
          inicio = time.time()

          print(f"Séries para processar: {len(arquivos)}")
          print(f"Pasta de saída: {PASTA} | Refazer: {REFAZER}")
          print("-" * 60)

          for idx, arq in enumerate(arquivos, 1):
              stem = os.path.splitext(os.path.basename(arq))[0]
              with open(arq, encoding="utf-8", errors="ignore") as f:
                  texto = f.read()

              nome, numero, eps = parse_txt(texto)
              numero = numero or stem
              print(f"\n[{idx}/{len(arquivos)}] {numero} | {nome} | {len(eps)} episódios")

              if not eps:
                  print("  ✗ nenhum episódio encontrado")
                  problemas.append(f"{stem}: nenhum episódio encontrado")
                  continue
              if not nome and numero not in overrides:
                  print("  ✗ sem 'SERIE:' no arquivo")
                  problemas.append(f"{stem}: sem 'SERIE:' no arquivo")
                  continue

              # se todos os episódios já existem e não é para refazer, nem consulta o TMDB
              if not REFAZER and all(
                  os.path.exists(os.path.join(PASTA, f"{numero}s{s:02d}e{e:02d}.html"))
                  for (s, e) in eps
              ):
                  pulados += len(eps)
                  print("  = tudo já existe, pulando")
                  continue

              max_temp = max(s for s, _ in eps)
              serie = achar_serie(nome, max_temp, overrides.get(numero))
              if not serie:
                  print("  ✗ série não encontrada no TMDB")
                  problemas.append(f"{stem}: '{nome}' não encontrada no TMDB")
                  continue

              nome_serie = serie.get("name") or serie.get("original_name") or nome
              ano = (serie.get("first_air_date") or "")[:4]
              nome_serie_ano = f"{nome_serie} ({ano})" if ano else nome_serie
              capa_serie = (IMG + serie["poster_path"]) if serie.get("poster_path") else ""
              print(f"  TMDB: {nome_serie_ano} (id {serie['id']}, {serie.get('number_of_seasons')} temp.)")
              relatorio.append(f"{numero} | {nome} -> TMDB {serie['id']} | {nome_serie_ano} | "
                               f"{serie.get('number_of_seasons')} temp. no TMDB, {max_temp} no txt")

              gerados_serie = 0
              for (s, e), link in sorted(eps.items()):
                  destino = os.path.join(PASTA, f"{numero}s{s:02d}e{e:02d}.html")
                  if os.path.exists(destino) and not REFAZER:
                      pulados += 1
                      continue

                  info = dados_temporada(serie["id"], s).get(e, {})
                  nome_ep = (info.get("name") or "").strip()
                  if re.fullmatch(r'(?:epis[oó]dio|episode)\s*\d+', nome_ep, re.I):
                      nome_ep = ""
                  capa = (IMG + info["still_path"]) if info.get("still_path") else capa_serie

                  partes = [nome_serie_ano, f"S{s:02d}E{e:02d}"]
                  if nome_ep:
                      partes.append(nome_ep)
                  partes.append(SUFIXO)
                  titulo = " - ".join(partes)

                  pagina = (MODELO
                      .replace("@@TITULO_JSON@@", json.dumps(titulo, ensure_ascii=False))
                      .replace("@@DESC_JSON@@", json.dumps("Assista " + titulo, ensure_ascii=False))
                      .replace("@@CAPA_JSON@@", json.dumps(capa))
                      .replace("@@LINK_JSON@@", json.dumps(link))
                      .replace("@@TITULO@@", html.escape(titulo))
                      .replace("@@LINK@@", html.escape(link, quote=True))
                      .replace("@@CAPA@@", html.escape(capa, quote=True)))

                  with open(destino, "w", encoding="utf-8") as out:
                      out.write(pagina)
                  total += 1
                  gerados_serie += 1
                  print(f"    ✓ {os.path.basename(destino)} | {titulo}")

              print(f"  → {gerados_serie} gerados nesta série | total até agora: {total} "
                    f"| {int(time.time() - inicio)}s")

          if relatorio:
              with open(os.path.join(PASTA, "_relatorio.txt"), "w", encoding="utf-8") as f:
                  f.write("\n".join(relatorio) + "\n")
          if problemas:
              with open(os.path.join(PASTA, "_problemas.txt"), "w", encoding="utf-8") as f:
                  f.write("\n".join(problemas) + "\n")

          print("\n" + "=" * 60)
          print(f"Gerados: {total} | Já existiam: {pulados} | Problemas: {len(problemas)} "
                f"| Tempo: {int(time.time() - inicio)}s")
          PY

      - name: Commit e push
        env:
          PASTA: ${{ inputs.pasta_saida }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${PASTA:-series_html}"
          if git diff --cached --quiet; then
            echo "Nada novo para commitar."
          else
            git commit -m "Gerar HTMLs das séries (oneplayer) [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push
          fi
