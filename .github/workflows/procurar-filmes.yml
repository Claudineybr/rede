name: Procurar filmes

on:
  workflow_dispatch:
    inputs:
      arquivo:
        description: "Arquivo com os IDs (um por linha, ex: tt0479952)"
        required: true
        default: "ids.txt"
      lote:
        description: "Quantos IDs processar nesta run (ex: 10000)"
        required: true
        default: "10000"
      paralelo:
        description: "Quantos filmes testar ao mesmo tempo (1 a 30)"
        required: true
        default: "15"
      auto_run:
        description: "Disparar automaticamente a próxima run quando ainda houver fila?"
        type: boolean
        required: false
        default: true
  push:
    paths:
      - "ids.txt"

permissions:
  contents: write

concurrency:
  group: procurar-filmes
  cancel-in-progress: false

jobs:
  procurar:
    name: Procurar nos servidores
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_CHAIN || secrets.GITHUB_TOKEN }}

      - name: Preparar lote
        id: preparar
        env:
          ARQUIVO: ${{ github.event.inputs.arquivo || 'ids.txt' }}
          LOTE: ${{ github.event.inputs.lote || '10000' }}
        run: |
          set -uo pipefail
          ARQ="$ARQUIVO"
          if [ ! -f "$ARQ" ]; then
            echo "::error::Nao achei o arquivo '$ARQ' no repositorio."
            exit 1
          fi

          grep -v -E '^[[:space:]]*(#([[:space:]]|$)|$)' "$ARQ" > lista.txt || true
          touch processados.txt

          TOTAL=$(awk 'END{print NR+0}' lista.txt)

          awk '
            FILENAME == "processados.txt" { p[$1]=1; next }
            match($0, /tt[0-9]{6,9}/) {
              id = substr($0, RSTART, RLENGTH)
              if (!(id in p)) print $0
            }
          ' processados.txt lista.txt > pendentes.txt

          PEND=$(awk 'END{print NR+0}' pendentes.txt)
          echo "Total no arquivo: $TOTAL"
          echo "Ja processados:   $((TOTAL - PEND))"
          echo "Pendentes:        $PEND"
          echo "Tamanho do lote:  $LOTE"

          if [ "$PEND" -eq 0 ]; then
            echo "::notice::Fila vazia - todos os IDs ja foram buscados."
            echo "VAZIO=1"        >> "$GITHUB_OUTPUT"
            echo "FALTAM=0"       >> "$GITHUB_OUTPUT"
            echo "0" > /tmp/faltam.txt
            : > lote_atual.txt
            exit 0
          fi

          head -n "$LOTE" pendentes.txt > lote_atual.txt
          N=$(awk 'END{print NR+0}' lote_atual.txt)
          FALTAM=$((PEND - N))
          echo "Lote atual:       $N"
          echo "Restantes apos:   $FALTAM"
          echo "$FALTAM" > /tmp/faltam.txt
          echo "VAZIO=0"        >> "$GITHUB_OUTPUT"
          echo "FALTAM=$FALTAM" >> "$GITHUB_OUTPUT"

      - name: Procurar cada ID em todos os servidores
        if: steps.preparar.outputs.VAZIO == '0'
        env:
          PARALELO: ${{ github.event.inputs.paralelo || '15' }}
        run: |
          set -uo pipefail

          cat > servidores.txt <<'SRV'
          fhd4 | http://fhd4.oneplayer.site/343rt342wtg34wetg34retg4rgh5kh4/FHD4/
          fhd4-b | http://fhd4.oneplayer.site/343rt342wtg34wetg34retg4rghy5rh/FHD4/
          hd5 | http://hd5.oneplayer.site/token/FHD5/
          hd5-b | http://hd5.oneplayer.site/343rt342wtg34wetg34retghksi68ssk/FHD5/
          fhd1 | http://fhd1.oneplayer.site/ertg43r5g34ty34yt543t43wer234t34y3s7/FHD3/
          fhd10 | http://fhd1.oneplayer.site/ertg43r5g34ty34yt543t43wer234t34y3s7/FHD10/
          SRV
          sed -i 's/^[[:space:]]*//; s/[[:space:]]*$//' servidores.txt
          echo "Servidores: $(awk 'END{print NR+0}' servidores.txt)"

          # bruto_lote.tsv: SO os achados (id<TAB>titulo<TAB>links)
          # nao_encontrados_lote.tsv: os NAO achados (id<TAB>titulo<TAB>usados) - artifact so
          # processados_lote.txt: TODOS os IDs (para append em processados.txt)
          : > bruto_lote.tsv
          : > nao_encontrados_lote.tsv
          : > processados_lote.txt

          TOTAL_LOTE=$(awk 'END{print NR+0}' lote_atual.txt)
          export TOTAL_LOTE

          : > /tmp/contador.n
          : > /tmp/contador.lock

          {
            echo "==================================================================="
            echo " INICIANDO BUSCA - LOTE DE $TOTAL_LOTE FILMES - PARALELO=$PARALELO"
            echo " Progresso em tempo real: [n/total] OK=achou XX=nao"
            echo "==================================================================="
          } >&2

          procurar() {
            local linha="$1" titulo id achou nome base url code usados n
            titulo=""
            if [[ "$linha" == *"|"* ]]; then
              titulo="${linha%%|*}"; linha="${linha#*|}"
            fi
            titulo="$(printf '%s' "$titulo" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
            id="$(printf '%s' "$linha" | grep -o -E 'tt[0-9]{6,9}' | head -1 || true)"
            [ -z "$id" ] && return 0

            achou=""; usados=""
            while IFS='|' read -r nome base; do
              nome="$(printf '%s' "${nome:-}" | tr -d '[:space:]')"
              base="$(printf '%s' "${base:-}" | tr -d '[:space:]')"
              [ -z "$nome" ] && continue
              url="${base}${id}.mp4"
              code=$(curl -s -o /dev/null -m 15 --range 0-255 -A "Mozilla/5.0" \
                -H "Referer: https://api-pobreflix-filmes.pages.dev/" \
                -w '%{http_code}' "$url" 2>/dev/null) || true
              [ -z "$code" ] && code="000"
              usados="${usados}${nome}:${code} "
              if [ "$code" = "200" ] || [ "$code" = "206" ]; then
                achou="${achou}${nome}=${url} "
              fi
            done < servidores.txt

            # ---- persistencia ----
            if [ -n "$achou" ]; then
              # salva SÓ os achados (sem "usados", para economizar espaco)
              printf '%s\t%s\t%s\n' "$id" "${titulo:--}" "${achou% }" >> bruto_lote.tsv
            else
              # nao achou: guarda separado (nao vai pro bruto commitado)
              printf '%s\t%s\t%s\n' "$id" "${titulo:--}" "${usados% }" >> nao_encontrados_lote.tsv
            fi
            # TODOS os IDs vao para processados_lote.txt (para nao retentar)
            printf '%s\n' "$id" >> processados_lote.txt

            # ---- progresso em tempo real ----
            n=$(flock /tmp/contador.lock bash -c \
                 'n=$(( $(cat /tmp/contador.n 2>/dev/null || echo 0) + 1 )); echo "$n" > /tmp/contador.n; echo "$n"')

            if [ -n "$achou" ]; then
              printf '[%s/%s] OK %s  %s  ->  %s\n' \
                "$n" "$TOTAL_LOTE" "$id" "${titulo:--}" \
                "${achou// /=, }" >&2
            else
              printf '[%s/%s] XX %s  %s  (nenhum servidor - descartado)\n' \
                "$n" "$TOTAL_LOTE" "$id" "${titulo:--}" >&2
            fi
          }
          export -f procurar

          tr '\n' '\0' < lote_atual.txt \
            | stdbuf -oL -eL xargs -0 -r -P "$PARALELO" -n 1 \
                stdbuf -oL -eL bash -c 'procurar "$1"' _

          ACHOU_LOTE=$(awk 'END{print NR+0}' bruto_lote.tsv)
          NAO_LOTE=$(awk 'END{print NR+0}' nao_encontrados_lote.tsv)
          {
            echo "==================================================================="
            echo " LOTE CONCLUIDO - $TOTAL_LOTE processados"
            echo "   achados:       $ACHOU_LOTE"
            echo "   nao achados:   $NAO_LOTE  (descartados do bruto)"
            echo "==================================================================="
          } >&2

          # Acumula SO os achados no bruto commitado
          touch bruto.tsv
          cat bruto_lote.tsv >> bruto.tsv

          # processados.txt recebe TODOS (achados + nao achados)
          cat processados_lote.txt >> processados.txt
          sort -u processados.txt -o processados.txt

          # (nao_encontrados_lote.tsv NAO e' acumulado nem commitado:
          #  fica apenas como artifact desta run)

      - name: Gerar relatórios
        if: steps.preparar.outputs.VAZIO == '0'
        env:
          GERAL_ATIVO: ${{ steps.preparar.outputs.FALTAM == '0' && '1' || '0' }}
        run: |
          python3 -u - <<'PY'
          import os, collections

          def ler_found(caminho):
              """bruto.tsv: id<TAB>titulo<TAB>links"""
              out = []
              try:
                  with open(caminho, encoding='utf-8', errors='replace') as f:
                      for l in f:
                          p = l.rstrip('\n').split('\t')
                          if len(p) < 3:
                              continue
                          out.append({'id': p[0], 'titulo': p[1],
                                      'links': p[2].split()})
              except FileNotFoundError:
                  pass
              return out

          def dedup(linhas):
              d = {}
              for r in linhas:
                  d[r['id']] = r
              return list(d.values())

          # Total processados (para saber quantos foram descartados)
          try:
              processados = sum(1 for _ in open('processados.txt', encoding='utf-8'))
          except FileNotFoundError:
              processados = 0

          todos = dedup(ler_found('bruto.tsv'))
          lote  = dedup(ler_found('bruto_lote.tsv'))

          def gerar(linhas, txt_path, md_path, titulo, total_proc):
              com = linhas
              sem = max(0, total_proc - len(com))
              conta = collections.Counter(n.split('=')[0] for r in com for n in r['links'])

              txt = ['=' * 67,
                     f'  CLAUFLIX - {titulo}',
                     f'  Processados: {total_proc} | Achados: {len(com)} | Descartados: {sem}',
                     '=' * 67, '']
              if conta:
                  txt.append('  Servidores onde apareceram:')
                  for k, v in conta.most_common():
                      txt.append(f'    {k:<8} {v:>5} filmes')
                  txt.append('')
              txt += ['=' * 67, '  ACHADOS', '=' * 67]
              for r in sorted(com, key=lambda x: x['titulo'].lower()):
                  txt.append('')
                  txt.append(f"- {r['titulo']}  [{r['id']}]")
                  for n in r['links']:
                      srv, link = n.split('=', 1)
                      txt.append(f'    {srv:<8} {link}')
              txt.append('')
              txt.append('  (Filmes nao encontrados foram descartados -')
              txt.append('   a lista do lote atual esta no artifact nao_encontrados_lote.tsv)')
              open(txt_path, 'w', encoding='utf-8').write('\n'.join(txt) + '\n')

              md = ['# ' + titulo, '',
                    f"**{total_proc} processados - {len(com)} achados - {sem} descartados**", '',
                    '| Filme | ID | Servidor | Link |', '|---|---|---|---|']
              for r in com:
                  for n in r['links']:
                      srv, link = n.split('=', 1)
                      md.append(f"| {r['titulo'].replace('|','/')} | {r['id']} | {srv} | {link} |")
              open(md_path, 'w', encoding='utf-8').write('\n'.join(md) + '\n')
              return '\n'.join(md)

          print(">>> Gerando relatorio do LOTE ATUAL...", flush=True)
          n_proc_lote = sum(1 for _ in open('processados_lote.txt', encoding='utf-8'))
          gerar(lote, 'resultado_lote.txt', 'resultado_lote.md', 'LOTE ATUAL', n_proc_lote)

          if os.environ.get('GERAL_ATIVO') == '1':
              print(">>> Fila zerada - gerando RELATORIO GERAL ACUMULADO...", flush=True)
              md_geral = gerar(todos, 'resultado.txt', 'resultado.md',
                               'RELATORIO GERAL ACUMULADO', processados)
              resumo = os.environ.get('GITHUB_STEP_SUMMARY')
              if resumo:
                  with open(resumo, 'a', encoding='utf-8') as f:
                      f.write(md_geral + '\n')
              print(">>> Relatorio geral gravado em resultado.txt / resultado.md", flush=True)
          else:
              print(">>> Ainda ha fila - relatorio geral sera gerado na ultima run.", flush=True)
          PY

      - name: Commit do progresso
        if: steps.preparar.outputs.VAZIO == '0'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # SO bruto.tsv (achados) e processados.txt (todos os IDs) sao commitados
          git add processados.txt bruto.tsv
          if [ "${{ steps.preparar.outputs.FALTAM }}" = "0" ]; then
            git add resultado.txt resultado.md
          fi

          if git diff --staged --quiet; then
            echo "Sem mudancas para commitar."
            exit 0
          fi

          git commit -m "chore: lote processado $(date -u +%Y%m%dT%H%MZ) [skip ci]"

          for i in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase origin main || true
            sleep 5
          done
          echo "::error::Falha ao dar push apos 3 tentativas."
          exit 1

      - name: Guardar o resultado (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-${{ github.run_number }}
          path: |
            resultado_lote.txt
            resultado_lote.md
            bruto_lote.tsv
            nao_encontrados_lote.tsv
            resultado.txt
            resultado.md
          if-no-files-found: warn

      - name: Disparar próxima run (se fila não vazia)
        if: |
          success() &&
          steps.preparar.outputs.VAZIO == '0' &&
          (
            github.event_name == 'schedule' ||
            github.event_name == 'push' ||
            inputs.auto_run == true ||
            inputs.auto_run == 'true'
          )
        env:
          GH_TOKEN: ${{ secrets.PAT_CHAIN }}
          REPO: ${{ github.repository }}
          LOTE_IN: ${{ github.event.inputs.lote || '10000' }}
          ARQ_IN:  ${{ github.event.inputs.arquivo || 'ids.txt' }}
          PAR_IN:  ${{ github.event.inputs.paralelo || '15' }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "PAT_CHAIN nao configurado: sem auto-chain."
            exit 0
          fi

          FALTAM=$(cat /tmp/faltam.txt 2>/dev/null || echo 0)
          echo "Faltam: $FALTAM"
          if [ "${FALTAM:-0}" -le 0 ]; then
            echo "Fila vazia, encerrando."
            exit 0
          fi

          LIMITE_ISO=$(date -u -d '60 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          RECENTES=$(gh run list --workflow="procurar-filmes.yml" \
            --event workflow_dispatch --limit 100 \
            --json createdAt \
            --jq "[.[] | select(.createdAt > \"$LIMITE_ISO\")] | length" \
            --repo "$REPO" 2>/dev/null || echo 0)
          echo "Encadeamentos na ultima hora: $RECENTES"
          if [ "${RECENTES:-0}" -ge 60 ]; then
            echo "Limite por hora atingido."
            exit 0
          fi

          sleep 30
          gh workflow run "procurar-filmes.yml" --repo "$REPO" --ref main \
            -f auto_run=true -f lote="$LOTE_IN" -f arquivo="$ARQ_IN" -f paralelo="$PAR_IN"
