name: Clonar PK e converter para Clau🍿 HTML

on:
  workflow_dispatch:

jobs:
  converter:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1) Clona o repo de origem (público -> NÃO precisa de token)
      - name: 📥 Clonar WaveLy2308/api_pobreflix_filmes
        run: git clone --depth 1 https://github.com/WaveLy2308/api_pobreflix_filmes.git /tmp/pk

      # 2) Checkout do repo destino (Claudineybr/rede) para commitar o resultado
      - name: 📥 Checkout do repo destino
        uses: actions/checkout@v4
        with:
          path: destino
          fetch-depth: 0

      # 3) Converte: tira 🕸️ PK, põe 🍿Clau, vira .html
      #    filmes -> oneplayer/   |   séries -> series_html/
      - name: 🔄 Converter PK -> Clau🍿 -> HTML
        run: python3 destino/scripts/pk_to_clau.py /tmp/pk destino

      # 4) Commit + push
      - name: 🎬 Commit e push
        run: |
          cd destino
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add oneplayer series_html
          if git diff --cached --quiet; then
            echo "Nada novo para commitar."
          else
            git commit -m "feat: PK -> Clau🍿 em HTML (filmes/oneplayer, series/series_html) [skip ci]"
            git push
          fi

      - name: 📊 Resumo
        run: |
          echo "Filmes em oneplayer/: $(ls destino/oneplayer/*.html 2>/dev/null | wc -l)"
          echo "Séries em series_html/: $(ls destino/series_html/*.html 2>/dev/null | wc -l)"
          echo "Arquivos com 🕸️ PK restantes: $(grep -rl '🕸️ PK' destino/oneplayer destino/series_html 2>/dev/null | wc -l)"
